# Verifies a branch compiles and passes checks. Never deploys.
name: CI

on:
  pull_request:

# Read-only. This workflow must not be able to publish anything.
permissions:
  contents: read

# Supersede in-flight runs for the same PR; only the latest push matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:run
      - name: Build
        # No VITE_TMDB_TOKEN here on purpose. Vite inlines env vars into the
        # bundle at build time, and this build is thrown away, so the token has
        # no reason to exist in a PR run. The two base URLs are public.
        env:
          VITE_TMDB_BASE_URL: ${{ vars.VITE_TMDB_BASE_URL }}
          VITE_TMDB_IMAGE_BASE_URL: ${{ vars.VITE_TMDB_IMAGE_BASE_URL }}
        run: npm run build
